name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push all images
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          SHA="${{ github.sha }}"
          for svc in auth shifts scale lab silos; do
            docker build \
              --file infrastructure/docker/Dockerfile.node \
              --build-arg SERVICE_NAME=$svc \
              --tag "$REGISTRY/guaycampo-$svc:$SHA" \
              --tag "$REGISTRY/guaycampo-$svc:staging" \
              --cache-from "type=registry,ref=$REGISTRY/guaycampo-$svc:staging" \
              .
            docker push "$REGISTRY/guaycampo-$svc:$SHA"
            docker push "$REGISTRY/guaycampo-$svc:staging"
          done
          docker build \
            --file infrastructure/docker/Dockerfile.web \
            --tag "$REGISTRY/guaycampo-web:$SHA" \
            --tag "$REGISTRY/guaycampo-web:staging" \
            --cache-from "type=registry,ref=$REGISTRY/guaycampo-web:staging" \
            .
          docker push "$REGISTRY/guaycampo-web:$SHA"
          docker push "$REGISTRY/guaycampo-web:staging"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name guaycampo-staging --region us-east-1

      - name: Run DB migrations
        run: |
          kubectl run migrations-${{ github.sha }} \
            --image=${{ steps.login-ecr.outputs.registry }}/guaycampo-auth:${{ github.sha }} \
            --restart=Never \
            --rm -i \
            --namespace=guaycampo-staging \
            --env="DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" \
            -- npm run db:migrate:prod
        timeout-minutes: 10

      - name: Deploy with Kustomize
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          SHA="${{ github.sha }}"
          cd infrastructure/k8s
          kustomize edit set image \
            guaycampo-auth=$REGISTRY/guaycampo-auth:$SHA \
            guaycampo-shifts=$REGISTRY/guaycampo-shifts:$SHA \
            guaycampo-scale=$REGISTRY/guaycampo-scale:$SHA \
            guaycampo-lab=$REGISTRY/guaycampo-lab:$SHA \
            guaycampo-silos=$REGISTRY/guaycampo-silos:$SHA \
            guaycampo-web=$REGISTRY/guaycampo-web:$SHA
          kubectl apply -k . --namespace=guaycampo-staging

      - name: Wait for rollout
        run: |
          for svc in auth shifts scale lab silos web; do
            kubectl rollout status deployment/guaycampo-$svc \
              -n guaycampo-staging --timeout=300s
          done

      - name: Run smoke tests
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"
          curl -f --retry 5 --retry-delay 10 "$STAGING_URL/api/health" || exit 1

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: "Staging deploy failed for commit ${{ github.sha }} — branch: ${{ github.ref_name }}"
