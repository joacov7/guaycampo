  # ---------------------------------------------------------------------------
  # Health check — no auth
  # ---------------------------------------------------------------------------
  - name: health-route
    service: auth-service
    paths:
      - /health
    methods:
      - GET
    strip_path: true
    preserve_host: false

# -----------------------------------------------------------------------------
# Global plugins (dev overrides)
# -----------------------------------------------------------------------------
plugins:
  # CORS — allow all origins in dev
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Tenant-ID
        - X-Request-ID
      exposed_headers:
        - X-RateLimit-Remaining
        - X-RateLimit-Reset
      credentials: false   # credentials: true is incompatible with origin: *
      max_age: 3600

  # Request correlation ID
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid#counter
      echo_downstream: true

  # Global rate limit fallback (very permissive in dev)
  - name: rate-limiting
    config:
      minute: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # Inject X-Powered-By and dev environment markers
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Powered-By: GuayCampo"
          - "X-Kong-Env: development"

  # Request debugger — log every request body + headers to stdout
  # Disable for specific routes by adding plugin with enabled: false
  - name: file-log
    config:
      path: /dev/stdout
      reopen: false
