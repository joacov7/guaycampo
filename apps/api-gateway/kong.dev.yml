      - /api/remitos
      - /api/prices
    strip_path: false
    preserve_host: false
    plugins:
      - name: jwt
        config:
          key_claim_name: tenantId
          claims_to_verify:
            - exp
          header_names:
            - Authorization
          secret_is_base64: false
          algorithm: HS256
      - name: rate-limiting
        config:
          minute: 1000
