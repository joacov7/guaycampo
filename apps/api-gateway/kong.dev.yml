_format_version: "3.0"
_transform: true

# =============================================================================
# GuayCampo - Kong API Gateway (DB-less / declarative config)
# LOCAL DEVELOPMENT configuration
#
# Differences from kong.yml (production):
#   - Rate limits are much more permissive (1000 req/min across the board)
#   - CORS allows any origin (*)
#   - http-log plugin is removed (no log aggregation service in dev)
#   - request-termination plugin added for easy mock endpoints
#   - All rate limits use local (in-memory) policy — no Redis dependency
# =============================================================================

# -----------------------------------------------------------------------------
# Upstream services
# -----------------------------------------------------------------------------
services:
  - name: auth-service
    url: http://guaycampo-auth:3001
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    retries: 0

  - name: shifts-service
    url: http://guaycampo-shifts:3002
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    retries: 0

  - name: scale-service
    url: http://guaycampo-scale:3003
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    retries: 0

  - name: lab-service
    url: http://guaycampo-lab:3004
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    retries: 0

  - name: silos-service
    url: http://guaycampo-silos:3005
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    retries: 0

  - name: billing-service
    url: http://guaycampo-billing:3006
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    retries: 0

# -----------------------------------------------------------------------------
# Routes
# -----------------------------------------------------------------------------
routes:
  # ---------------------------------------------------------------------------
  # Auth — public endpoints (no JWT required)
  # ---------------------------------------------------------------------------
  - name: auth-public
    service: auth-service
    paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
    methods:
      - POST
    strip_path: false
    preserve_host: false
    plugins:
      - name: rate-limiting
        config:
          minute: 1000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Kong-Env: development"

  # ---------------------------------------------------------------------------
  # Auth — protected endpoints
  # ---------------------------------------------------------------------------
  - name: auth-protected
    service: auth-service
    paths:
      - /api/auth
    strip_path: false
    preserve_host: false
    plugins:
      - name: jwt
        config:
          key_claim_name: tenantId
          claims_to_verify:
            - exp
          header_names:
            - Authorization
          secret_is_base64: false
          algorithm: HS256
      - name: rate-limiting
        config:
          minute: 1000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: tenant-injector
        config: {}
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Kong-Env: development"

  # ---------------------------------------------------------------------------
  # Shifts
  # ---------------------------------------------------------------------------
  - name: shifts-routes
    service: shifts-service
    paths:
      - /api/shifts
      - /api/trucks
      - /api/queue
    strip_path: false
    preserve_host: false
    plugins:
      - name: jwt
        config:
          key_claim_name: tenantId
          claims_to_verify:
            - exp
          header_names:
            - Authorization
          secret_is_base64: false
          algorithm: HS256
      - name: rate-limiting
        config:
          minute: 1000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: tenant-injector
        config: {}
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Kong-Env: development"

  # ---------------------------------------------------------------------------
  # Scale
  # ---------------------------------------------------------------------------
  - name: scale-routes
    service: scale-service
    paths:
      - /api/scale
      - /api/tickets
      - /api/devices
      - /api/drying
    strip_path: false
    preserve_host: false
    plugins:
      - name: jwt
        config:
          key_claim_name: tenantId
          claims_to_verify:
            - exp
          header_names:
            - Authorization
          secret_is_base64: false
          algorithm: HS256
      - name: rate-limiting
        config:
          minute: 1000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: tenant-injector
        config: {}
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Kong-Env: development"

  # ---------------------------------------------------------------------------
  # Lab
  # ---------------------------------------------------------------------------
  - name: lab-routes
    service: lab-service
    paths:
      - /api/lab
      - /api/samples
      - /api/certificates
    strip_path: false
    preserve_host: false
    plugins:
      - name: jwt
        config:
          key_claim_name: tenantId
          claims_to_verify:
            - exp
          header_names:
            - Authorization
          secret_is_base64: false
          algorithm: HS256
      - name: rate-limiting
        config:
          minute: 1000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: tenant-injector
        config: {}
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Kong-Env: development"

  # ---------------------------------------------------------------------------
  # Silos
  # ---------------------------------------------------------------------------
  - name: silos-routes
    service: silos-service
    paths:
      - /api/silos
      - /api/readings
      - /api/alerts
      - /api/aeration
      - /api/movements
    strip_path: false
    preserve_host: false
    plugins:
      - name: jwt
        config:
          key_claim_name: tenantId
          claims_to_verify:
            - exp
          header_names:
            - Authorization
          secret_is_base64: false
          algorithm: HS256
      - name: rate-limiting
        config:
          minute: 1000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: tenant-injector
        config: {}
      - name: request-transformer
