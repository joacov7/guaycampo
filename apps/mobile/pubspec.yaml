name: guaycampo_mobile
description: GuayCampo — App para choferes de transporte de granos
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Local storage
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.6.2

  # QR
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0

  # Location
  geolocator: ^13.0.2

  # Notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.0

  # UI
  lucide_icons: ^1.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.1
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true
