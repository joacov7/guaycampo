# =============================================================================
# GuayCampo - Kubernetes Secrets Template
#
# WARNING: This file contains ONLY placeholder values.
# Real secrets must be managed via AWS Secrets Manager and injected at deploy
# time using the AWS Secrets Manager CSI driver or External Secrets Operator.
#
# Never commit real secret values to this repository.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: guaycampo-secrets
  labels:
    app.kubernetes.io/name: guaycampo
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database — managed in AWS RDS, injected from Secrets Manager
  database-url: "postgresql://REPLACE_USER:REPLACE_PASS@REPLACE_HOST:5432/guaycampo?schema=public"

  # Redis — managed in AWS ElastiCache, injected from Secrets Manager
  redis-url: "redis://:REPLACE_PASS@REPLACE_HOST:6379"

  # JWT — generated and stored in AWS Secrets Manager
  jwt-secret: "REPLACE_WITH_STRONG_SECRET"
  jwt-refresh-secret: "REPLACE_WITH_STRONG_REFRESH_SECRET"

  # AWS credentials for S3, SES, etc.
  aws-access-key-id: "REPLACE_AWS_ACCESS_KEY_ID"
  aws-secret-access-key: "REPLACE_AWS_SECRET_ACCESS_KEY"
  aws-s3-bucket: "guaycampo-uploads"

  # MQTT / EMQX
  mqtt-url: "mqtt://REPLACE_EMQX_HOST:1883"
  mqtt-username: "REPLACE_MQTT_USERNAME"
  mqtt-password: "REPLACE_MQTT_PASSWORD"

  # External integrations
  whatsapp-api-token: "REPLACE_WHATSAPP_TOKEN"
  sendgrid-api-key: "REPLACE_SENDGRID_KEY"
  sentry-dsn: "REPLACE_SENTRY_DSN"
  ocr-api-key: "REPLACE_OCR_API_KEY"

  # AFIP (Argentina tax authority)
  afip-cuit: "REPLACE_AFIP_CUIT"
  afip-cert: "REPLACE_BASE64_CERT"
  afip-key: "REPLACE_BASE64_KEY"
