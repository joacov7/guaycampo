apiVersion: apps/v1
kind: Deployment
metadata:
  name: guaycampo-scale
  labels:
    app: guaycampo-scale
    app.kubernetes.io/name: guaycampo-scale
    app.kubernetes.io/component: service
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guaycampo-scale
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: guaycampo-scale
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: scale
          image: guaycampo-scale:latest
          ports:
            - containerPort: 3003
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: guaycampo-common-config
                  key: NODE_ENV
            - name: PORT
              value: "3003"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: guaycampo-common-config
                  key: TZ
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: guaycampo-common-config
                  key: LOG_LEVEL
            - name: AUTH_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: guaycampo-common-config
                  key: AUTH_SERVICE_HOST
            - name: AUTH_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: guaycampo-common-config
                  key: AUTH_SERVICE_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guaycampo-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: guaycampo-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: guaycampo-secrets
                  key: jwt-secret
            - name: OCR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: guaycampo-secrets
                  key: ocr-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [guaycampo-scale]
                topologyKey: kubernetes.io/hostname
