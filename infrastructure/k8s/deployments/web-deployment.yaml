apiVersion: apps/v1
kind: Deployment
metadata:
  name: guaycampo-web
  labels:
    app: guaycampo-web
    app.kubernetes.io/name: guaycampo-web
    app.kubernetes.io/component: frontend
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guaycampo-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: guaycampo-web
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: web
          image: guaycampo-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: guaycampo-common-config
                  key: NODE_ENV
            - name: PORT
              value: "3000"
            - name: NEXT_TELEMETRY_DISABLED
              valueFrom:
                configMapKeyRef:
                  name: guaycampo-common-config
                  key: NEXT_TELEMETRY_DISABLED
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: guaycampo-common-config
                  key: TZ
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.guaycampo.com"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://app.guaycampo.com"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [guaycampo-web]
                topologyKey: kubernetes.io/hostname
